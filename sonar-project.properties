sonar.projectKey=CrediScan-UdeA-FabricaEscuela_crediscan-backend
sonar.organization=crediscan-udea-fabricaescuela
sonar.host.url=https://sonarcloud.io
sonar.projectName=crediscan-backend

# Fuentes y pruebas
sonar.sources=src/main/java
sonar.tests=src/test/java
sonar.java.binaries=build/classes/java/main
sonar.java.test.binaries=build/classes/java/test

# Cobertura de pruebas unitarias (JaCoCo)
sonar.java.coveragePlugin=jacoco
sonar.coverage.jacoco.xmlReportPaths=build/reports/jacoco/test/jacocoTestReport.xml

# Exclusion de reglas Oracle/PL/SQL — el proyecto usa PostgreSQL,
# donde VARCHAR es correcto y VARCHAR2 no existe.
sonar.issue.ignore.multicriteria=plsql1,plsql2,seed1
sonar.issue.ignore.multicriteria.plsql1.ruleKey=plsql:*
sonar.issue.ignore.multicriteria.plsql1.resourceKey=**/db/migration/*.sql
sonar.issue.ignore.multicriteria.plsql2.ruleKey=flyway:*
sonar.issue.ignore.multicriteria.plsql2.resourceKey=**/db/migration/*.sql
# Literales duplicados en seed data SQL son inherentes (filas con mismos valores).
sonar.issue.ignore.multicriteria.seed1.ruleKey=*:S1192
sonar.issue.ignore.multicriteria.seed1.resourceKey=**/db/migration/V15__seed_data.sql