spring:
  datasource:
    url: jdbc:tc:postgresql:16-alpine:///credit_scoring_test
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  flyway:
    clean-disabled: false

logging:
  level:
    co.udea.codefactory.creditscoring: INFO
    org.springframework: WARN
    org.testcontainers: INFO

app:
  security:
    jwt:
      secret: ${JWT_SECRET:test-only-not-a-real-secret}
      expiration-ms: 3600000
    crypto:
      encryption-key-base64: ${CRYPTO_ENCRYPTION_KEY_BASE64:test-only-not-a-real-secret}
      hash-key-base64: ${CRYPTO_HASH_KEY_BASE64:test-only-not-a-real-secret}
