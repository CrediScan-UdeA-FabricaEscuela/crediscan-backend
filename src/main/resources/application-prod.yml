server:
  port: ${PORT:8080}

spring:
  main:
    lazy-initialization: true

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  flyway:
    clean-disabled: true
    # Reintenta la conexión en vez de fallar al arranque si postgres aún no acepta
    # conexiones (la app y la BD arrancan en paralelo sin orden garantizado en k8s).
    connect-retries: 10
    connect-retries-interval: 10

logging:
  level:
    co.udea.codefactory.creditscoring: INFO
    org.springframework: WARN
    org.hibernate: WARN

management:
  endpoint:
    health:
      show-details: when-authorized
