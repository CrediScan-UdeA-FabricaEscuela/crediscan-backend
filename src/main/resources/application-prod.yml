spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  flyway:
    clean-disabled: true
    # V15 fue modificada (placeholder de password_hash) después de aplicarse en Render.
    # repair-on-migrate sincroniza el checksum sin re-ejecutar la migración:
    # los datos del admin ya están en la DB, el cambio sólo aplicaría a deploys fresh.
    repair-on-migrate: true

logging:
  level:
    co.udea.codefactory.creditscoring: INFO
    org.springframework: WARN
    org.hibernate: WARN

management:
  endpoint:
    health:
      show-details: when-authorized
